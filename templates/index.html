{% extends "base.html" %}
{% load static %}

{% block content %}
      <section class="hero section" id="home">
        <div class="hero-copy">
          <p class="eyebrow">{{ copy.portfolio }}</p>
          <h1>Maximus<br />Quinn Hertada</h1>
          <p class="role">{{ copy.role }}</p>
          <div class="hero-links">
            <a
              class="social-icon"
              href="https://mail.google.com/mail/?view=cm&fs=1&to=maximus.quinn@gmail.com"
              target="_blank"
              rel="noreferrer"
              aria-label="Send email"
              title="Email"
            >
              <img src="{% static 'img/gmail.png' %}" alt="" />
            </a>
            <a
              class="social-icon"
              href="https://github.com/MaxKwen"
              target="_blank"
              rel="noreferrer"
              aria-label="GitHub profile"
              title="GitHub"
            >
              <img src="{% static 'img/github.png' %}" alt="" />
            </a>
            <a
              class="social-icon"
              href="https://www.linkedin.com/in/maximus-hertada/"
              target="_blank"
              rel="noreferrer"
              aria-label="LinkedIn profile"
              title="LinkedIn"
            >
              <img src="{% static 'img/linkedin.png' %}" alt="" />
            </a>
          </div>
        </div>
        <div class="portrait-frame">
          <img
            src="{% static 'img/max.jpeg' %}"
            alt="Portrait of Maximus Quinn Hertada"
          />
        </div>
      </section>
{% endblock content %}
