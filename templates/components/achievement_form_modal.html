<div id="achievement-form-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="achievement-form-title">
  <button type="button"
          class="project-form-modal__backdrop"
          popovertarget="achievement-form-modal"
          popovertargetaction="hide"
          aria-label="{{ copy.close_form }}"></button>

  <div class="project-form-modal__content">
    <button type="button"
            class="project-form-modal__close"
            popovertarget="achievement-form-modal"
            popovertargetaction="hide"
            aria-label="{{ copy.close_form }}">×</button>

    {# Judul dan tombol diganti JavaScript sesuai mode tambah (POST) atau edit (PATCH) #}
    <h2 id="achievement-form-title">{{ copy.add_heading }}</h2>
    <form id="achievement-form" class="project-form" novalidate>
      <p id="achievement-form-errors" class="form-error errorlist hide" role="alert"></p>
      {% for field in form %}
        <div class="form-group">
          <label for="{{ field.id_for_label }}">{{ field.label }}</label>
          {{ field }}
          <p id="achievement-error-{{ field.name }}"
             class="form-error"
             data-error-for="{{ field.name }}"
             aria-live="polite"></p>
        </div>
      {% endfor %}
      <div class="project-form-modal__actions">
        <button type="button"
                class="button button-secondary"
                popovertarget="achievement-form-modal"
                popovertargetaction="hide">{{ copy.cancel }}</button>
        <button type="submit" class="button">{{ copy.add_achievement }}</button>
      </div>
    </form>
  </div>
</div>
