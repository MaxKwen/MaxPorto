<button
  type="button"
  class="button button-danger"
  popovertarget="delete-project-{{ project.pk }}"
  aria-label="{{ copy.delete_project }}: {{ project.title }}"
>
  {{ copy.delete_project }}
</button>
<div
  id="delete-project-{{ project.pk }}"
  class="project-delete-modal"
  popover="auto"
  role="dialog"
  aria-modal="true"
  aria-labelledby="delete-project-title-{{ project.pk }}"
>
  <button
    type="button"
    class="project-delete-modal__backdrop"
    popovertarget="delete-project-{{ project.pk }}"
    popovertargetaction="hide"
    aria-label="{{ copy.cancel }}"
  ></button>
  <div class="project-delete-modal__content">
    <button
      type="button"
      class="project-delete-modal__close"
      popovertarget="delete-project-{{ project.pk }}"
      popovertargetaction="hide"
      aria-label="{{ copy.cancel }}"
    >×</button>
    <h2 id="delete-project-title-{{ project.pk }}">{{ copy.delete_title }}</h2>
    <p>{{ copy.delete_prompt }} <strong>{{ project.title }}</strong>?</p>
    <div class="project-delete-modal__actions">
      <button
        type="button"
        class="button button-secondary"
        popovertarget="delete-project-{{ project.pk }}"
        popovertargetaction="hide"
      >{{ copy.cancel }}</button>
      <form method="post" action="{% url 'main:delete_project' project.pk %}">
        {% csrf_token %}
        <button type="submit" class="button button-danger">{{ copy.confirm_delete }}</button>
      </form>
    </div>
  </div>
</div>
